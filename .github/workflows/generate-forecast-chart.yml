name: Generate forecast chart

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_chart.py"
      - "data/aggregate_exstintion_measure.xlsx"
      - "data/ARIMA_forecast_world.xlsx"
      - ".github/workflows/generate-forecast-chart.yml"

permissions:
  contents: write

jobs:
  build-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chart dependencies
        run: pip install pandas matplotlib openpyxl

      - name: Generate forecast chart
        run: python generate_chart.py

      - name: Commit generated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/biodiversity-arima-forecast.png
          git diff --cached --quiet || git commit -m "Update generated biodiversity forecast chart"
          git push
